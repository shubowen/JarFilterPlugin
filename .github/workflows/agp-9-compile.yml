name: AGP 9 Compile Verification

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  compile:
    name: Compile with AGP 9.2.1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - name: Validate Gradle wrapper and toolchain
        run: ./gradlew --version

      - name: Run JVM tests
        run: ./gradlew --no-daemon :test:test --stacktrace

      - name: Assemble example application
        run: ./gradlew --no-daemon :example:assembleDebug --stacktrace
